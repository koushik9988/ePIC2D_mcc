# Ion gun configuration (2D, new species format)
[file]
output = data_iongun/

[time]
NUM_TS = 50000
DT_coeff = 0.01

[diagnostics]
write_interval = 50
write_interval_phase = 500
write_diagnostics = 50
write_flag = 1
save_fig = 1
sub_cycle_interval = 20
precision = 4
diagtype = basic

[PlotFlags]
phase_space     = 0
config_space    = 1
electric_field  = 1
potential_field = 1
density_contour = 1
ke_components   = 1
total_energy    = 1
species_index   = 1

[domain]
Nx       = 100
Ny       = 50
x0       = 0
y0       = 0
# 80x50 grid, unchanged

[Grids]
grid_count = 8

#inner
grid_0.type = reactconduct
grid_0.min_x = 0
grid_0.min_y = 30
grid_0.max_x = 22
grid_0.max_y = 31
grid_0.grid_voltage = 100 # in volt

grid_1.type = reactconduct
grid_1.min_x = 0
grid_1.min_y = 19
grid_1.max_x = 22
grid_1.max_y = 20
grid_1.grid_voltage = 100 # in volt

#outer
grid_2.type = reactconduct
grid_2.min_x = 0
grid_2.min_y = 31
grid_2.max_x = 26
grid_2.max_y = 32
grid_2.grid_voltage = 0 # in 

grid_3.type = reactconduct
grid_3.min_x = 0
grid_3.min_y = 18
grid_3.max_x = 26
grid_3.max_y = 19
grid_3.grid_voltage = 0 # in volt

#opening (first) inner
grid_4.type = reactconduct
grid_4.min_x = 22
grid_4.min_y = 27
grid_4.max_x = 23
grid_4.max_y = 31
grid_4.grid_voltage = -10000 # in volt

grid_5.type = reactconduct
grid_5.min_x = 22
grid_5.min_y = 19
grid_5.max_x = 23
grid_5.max_y = 23
grid_5.grid_voltage = -10000

#opening (second)
grid_6.type = reactconduct
grid_6.min_x = 26
grid_6.min_y = 27
grid_6.max_x = 27
grid_6.max_y = 32
grid_6.grid_voltage = 0 # in volt

grid_7.type = reactconduct
grid_7.min_x = 26
grid_7.min_y = 18
grid_7.max_x = 27
grid_7.max_y = 23
grid_7.grid_voltage = 0
#opening (third)

[Emitters]
count = 1  # Four emitters, one for each side

emitter_0.x0 = 1
emitter_0.y0 = 20
emitter_0.x1 = 1
emitter_0.y1 = 30
emitter_0.temp = 0
emitter_0.numparticle = 15
emitter_0.vdx = 0.0
emitter_0.vdy = 0.0
emitter_0.species_idx1 = 0
emitter_0.species_idx2 = 1

[normalization]
# 1 = electron scale, 2 = ion scale, 3 = subcycling, 4 = mixed, 5 = custom
norm_scheme = 2
vel_norm_scheme = 2
lenght_scale = 0.005
time_scale = omegape
energy_scale = 1

[solver]
solvertype = gs
tolerance = 1e-3
max_iteration = 4000

[simulation]
shapefunction = CIC
push_parallal = false
deposit_parallal = false
density = 1E13
bc = open
ionfixed = 0

[ExternalField]
B = 0.1
theta = 90
azimuth = 0

[collision]
# true / false
elastic = false
excitation = false
ionization = false
GAS_DENSITY = 5e17
collgroup = 01

pion_elastic = false
nion_elastic = false
e_detach_collision = false
GAS_TYPE = AR

[Species]
count = 2

species_0.name = electron
species_0.mass = 9.10938215E-31
species_0.num = 5000
species_0.temp = 1.0
species_0.charge_sign = -1
species_0.normden = 1.0
species_0.vsx = 0.0
species_0.vsy = 0.0
species_0.loadtype_posx = random
species_0.loadtype_posy = random
species_0.loadtype_velx = uniform
species_0.loadtype_vely = uniform

species_1.name = ion
species_1.mass = 1.6726219e-27
species_1.num = 5000
species_1.temp = 0.1
species_1.charge_sign = 1
species_1.normden = 0.0
species_1.vsx = 0.0
species_1.vsy = 0.0
species_1.loadtype_posx = random
species_1.loadtype_posy = random
species_1.loadtype_velx = uniform
species_1.loadtype_vely = uniform
